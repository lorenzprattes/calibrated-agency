[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "calibrated-agency"
version = "0.1.0"
description = "Bayesian calibration of discrete LLM actions while retaining contextual variation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = []
keywords = ["llm", "calibration", "vllm", "transformers", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
transformers = [
  "torch>=2.4",
  "transformers>=5.5.3,<5.15",
]
vllm = [
  "vllm==0.26.*",
]
all = [
  "vllm==0.26.*",
  "transformers>=5.5.3,<5.15",
]

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/calibrated_agency"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires an external model or vLLM endpoint",
  "gpu: requires a CUDA GPU",
]

[tool.coverage.run]
branch = true
source = ["calibrated_agency"]
omit = ["*/calibrated_agency/backends/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["calibrated_agency"]

[[tool.mypy.overrides]]
module = [
  "calibrated_agency.backends.transformers_native",
  "calibrated_agency.backends.vllm_native",
]
ignore_missing_imports = true
disallow_subclassing_any = false
