name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov
      - run: uv build
      - name: Check isolated wheel installation
        run: |
          uv venv /tmp/calibrated-agency-wheel
          uv pip install --python /tmp/calibrated-agency-wheel/bin/python --no-deps dist/*.whl
          /tmp/calibrated-agency-wheel/bin/python -I -c 'from calibrated_agency import decide; assert decide({"a": 0, "b": -1000}, {"a": 1, "b": 1}, {"a": 1, "b": 1}, 1, seed=1).action == "a"'
